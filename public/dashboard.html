<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        /* Apply saved display preferences before first paint (see assets/js/prefs.js) */
        (function () {
            var d = document.documentElement, p = {};
            try { p = JSON.parse(localStorage.getItem('wm_prefs')) || {}; } catch (e) {}
            d.dataset.theme = p.theme || 'light';
            d.dataset.text = p.text || 'm';
            if (p.cvd) d.dataset.cvd = 'on';
            if (p.dys) d.dataset.dys = 'on';
            if (p.motion) d.dataset.motion = 'reduce';
            if (p.contrast) d.dataset.contrast = 'more';
            if (p.dys) document.write('<link rel="stylesheet" id="font-lexend" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400..700&display=swap">');
            var dark = d.dataset.theme === 'dark' || (d.dataset.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.write('<meta name="theme-color" content="' + (dark ? '#000000' : '#f4f7fb') + '">');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Accueil · Water Mirror</title>
    <meta name="description" content="Votre dernière douche, vos économies et votre progression.">
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/img/logo-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="/assets/js/pages/dashboard.js"></script>
</head>
<body data-page="dashboard">
    <header class="topbar" data-nav="top"></header>

    <main class="page">
        <header class="page-header">
            <h1 class="title-1"><span id="greeting">Bonjour</span>, <span id="user-name"></span></h1>
            <p class="label" style="display: flex; align-items: center; gap: 8px;">
                <span class="dot" id="conn-dot"></span><span id="conn-text">Connexion…</span>
            </p>
        </header>

        <div class="stack">
            <section class="card hero-card" aria-labelledby="last-title">
                <div>
                    <h2 class="label" id="last-title">Dernière douche</h2>
                    <p class="hero-value" style="margin-top: 10px;"><span id="last-liters">—</span><small>L</small></p>
                    <div class="meta-row">
                        <span><strong id="last-duration">—</strong> min</span>
                        <span><strong id="last-flow">—</strong> L/min</span>
                        <span id="last-vs-avg"></span>
                    </div>
                </div>
                <button class="mascot-zone" id="mascot" aria-label="Goutti">
                    <span class="bubble" id="mascot-msg">…</span>
                    <img class="mascot" src="/img/goutti.webp" alt="" width="125" height="160">
                </button>
            </section>

            <section class="grid grid-2x2 grid-4" aria-label="Statistiques">
                <div class="card"><p class="label">Moyenne</p><p class="stat-value"><span id="stat-avg">—</span><small>L</small></p></div>
                <div class="card"><p class="label">Économisé</p><p class="stat-value"><span id="stat-saved">—</span></p></div>
                <div class="card"><p class="label">Série éco</p><p class="stat-value"><span id="stat-streak">—</span><small id="stat-streak-unit">douches</small></p></div>
                <div class="card"><p class="label">Douches</p><p class="stat-value"><span id="stat-count">—</span></p></div>
            </section>

            <section class="card" aria-labelledby="chart-title">
                <div class="card-header">
                    <h2 class="headline" id="chart-title">Consommation</h2>
                    <div class="segmented" id="chart-view" role="group" aria-label="Période">
                        <button data-value="daily" aria-pressed="true">Douches</button>
                        <button data-value="weekly" aria-pressed="false">Semaines</button>
                        <button data-value="monthly" aria-pressed="false">Mois</button>
                    </div>
                </div>
                <div class="chart-wrap"><canvas id="chart" aria-label="Litres consommés"></canvas></div>
            </section>

            <div class="grid grid-2">
                <section class="card tree-card" aria-labelledby="tree-title">
                    <img id="tree-img" src="/img/arbre_lvl1.png" alt="" width="96" height="96">
                    <div class="grow">
                        <div class="card-header" style="margin-bottom: 8px;">
                            <h2 class="headline" id="tree-title">Écosystème</h2>
                            <span class="badge badge-brand" id="tree-level">Niveau 1</span>
                        </div>
                        <div class="progress"><span id="tree-progress"></span></div>
                        <p class="label" id="tree-goal" style="margin-top: 8px;"></p>
                    </div>
                </section>

                <section class="card tip" aria-labelledby="tip-title">
                    <span class="tip-icon"><i data-icon="bulb"></i></span>
                    <div>
                        <h2 class="headline" id="tip-title">Le saviez-vous ?</h2>
                        <p class="secondary" id="tip-text" style="margin-top: 4px;"></p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <nav class="tabbar" data-nav="tabs"></nav>

    <div class="sheet" id="drop-sheet" role="dialog" aria-modal="true" aria-labelledby="drop-title" style="text-align: center;">
        <div class="sheet-handle"></div>
        <img src="/img/goutti.webp" alt="" width="110" height="140" style="height: 140px; width: auto; margin: 0 auto 12px;">
        <h2 class="title-2" id="drop-title"></h2>
        <p class="secondary" id="drop-text" style="margin: 8px auto 20px; max-width: 22rem;"></p>
        <button class="btn btn-primary btn-block" id="drop-ok">Continuer</button>
    </div>
</body>
</html>
