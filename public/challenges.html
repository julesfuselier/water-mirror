<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Défis · Water Mirror</title>
    <meta name="description" content="Défis du jour, objectifs de famille et trophées.">
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/img/logo-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script type="module" src="/assets/js/pages/challenges.js"></script>
</head>
<body data-page="challenges">
    <header class="topbar" data-nav="top"></header>

    <main class="page">
        <header class="page-header page-header-row">
            <div>
                <h1 class="title-1">Défis</h1>
                <p id="status-text">Relève-les sous la douche, récupère tes points ici.</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <span class="badge badge-brand"><span id="xp" class="num">0</span> XP</span>
                <span class="badge">Série <span id="streak" class="num">0</span></span>
            </div>
        </header>

        <section aria-labelledby="daily-title">
            <h2 class="title-2 section-title" id="daily-title">Aujourd’hui</h2>
            <div class="stack" data-group="daily"></div>
        </section>

        <section class="section" aria-labelledby="family-title">
            <h2 class="title-2 section-title" id="family-title">En famille</h2>
            <div class="stack" data-group="family"></div>
        </section>

        <section class="section" aria-labelledby="career-title">
            <h2 class="title-2 section-title" id="career-title">Trophées</h2>
            <div class="stack" data-group="career"></div>
        </section>
    </main>

    <nav class="tabbar" data-nav="tabs"></nav>
</body>
</html>
