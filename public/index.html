<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Water Mirror | Select Profile</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/index.css">
    <script type="module" src="/assets/js/pages/index.js"></script>
</head>
<body data-page="index">

    <div class="main-app" id="mainApp">
        <header class="home-header">
            <img src="img/logo.png" alt="Water Mirror Logo" class="main-logo">
            <div class="family-impact">
                <i class="fas fa-globe-europe" style="color: var(--primary);"></i>
                <span id="global-money">0.00</span> €
            </div>
        </header>

        <section class="selection-area">
            <div class="welcome-text">
                <h2>Who is showering?</h2>
                <p>Tap your profile to sign in.</p>
            </div>

            <div id="profile-grid" class="profile-grid">
                <!-- Profiles injected here by JS -->
            </div>

            <div class="btn-manage-container">
                <button class="btn-manage" data-action="toggle-manage">
                    <i class="fas fa-users-cog"></i> Manage Family
                </button>
            </div>
        </section>
    </div>

    <!-- Overlay & Bottom Sheet -->
    <div class="modal-overlay" id="modal-overlay" data-action="toggle-manage"></div>
    <div id="manage-panel" class="manage-panel">
        <div class="panel-drag-handle"></div>
        <div class="panel-header">
            <h3>Family Settings</h3>
            <button class="btn-close-icon" data-action="toggle-manage"><i class="fas fa-times"></i></button>
        </div>
        <div class="panel-body">
            <div class="add-member-box">
                <input type="text" id="new-member-name" placeholder="New name...">
                <button class="btn-add" id="btn-add-member"><i class="fas fa-plus"></i></button>
            </div>
            <div id="member-list-edit" style="max-height: 40vh; overflow-y: auto;">
                <!-- Members edit list injected here -->
            </div>
        </div>
    </div>
</body>
</html>
