<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Water Mirror</title>
    <meta name="description" content="Qui se douche ? Choisissez votre profil Water Mirror.">
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/img/logo-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script type="module" src="/assets/js/pages/index.js"></script>
</head>
<body data-page="index">
    <main class="welcome">
        <header class="welcome-top">
            <a class="brand" href="/"><img src="/img/logo-mark.png" alt="" width="22" height="26">Water Mirror</a>
            <span class="badge badge-brand" title="Économies cumulées de toute la famille">
                <i data-icon="drop"></i><span id="family-savings" class="num">—</span>
            </span>
        </header>

        <section class="welcome-hero">
            <div class="welcome-main">
                <h1 class="display">On ne réduit que <em class="accent brand-text">ce qu’on voit…</em></h1>
                <h2 class="title-2 question">Qui se douche ?</h2>
                <div class="profiles" id="profiles"></div>
            </div>
            <img class="welcome-mascot" src="/img/goutti.webp" alt="Goutti, la mascotte Water Mirror, fait coucou" width="280" height="360">
        </section>

        <footer class="welcome-footer">
            <button class="btn btn-plain" id="btn-manage"><i data-icon="people"></i> Gérer la famille</button>
            <a class="btn btn-plain" href="/about">Découvrir le projet <i data-icon="arrow"></i></a>
        </footer>
    </main>

    <div class="sheet" id="family-sheet" role="dialog" aria-modal="true" aria-labelledby="family-title">
        <div class="sheet-handle"></div>
        <div class="sheet-body">
            <h2 class="title-2" id="family-title">La famille</h2>
            <p class="label" style="margin-top: 4px;">Chaque membre choisit son profil sur le boîtier avant de se doucher.</p>
            <form class="add-member" id="add-member">
                <label class="sr-only" for="new-member">Prénom</label>
                <input class="input" id="new-member" placeholder="Prénom" autocomplete="off" maxlength="40">
                <button class="btn btn-primary" type="submit">Ajouter</button>
            </form>
            <div id="member-list"></div>
            <button class="btn btn-block" id="btn-done" style="margin-top: 20px;">Terminé</button>
        </div>
    </div>
</body>
</html>
