<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ranking | Water Mirror</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/pages/ranking.css">
    <script type="module" src="/assets/js/pages/ranking.js"></script>
</head>
<body data-page="ranking">

    <div class="master-bg"></div>

    <nav class="sidebar" data-nav="sidebar"></nav>

    <main class="main-content">
        <header class="top-header">
            <div>
                <div class="date-text" id="status-text"><i class="fas fa-satellite-dish"></i> Syncing Live...</div>
                <h1 class="ranking-title">Hall of <span>Fame</span></h1>
            </div>
            <div class="squad-badge"><i class="fas fa-bolt"></i> Live Data</div>
        </header>

        <section class="podium-container">
            <div class="podium-column second" id="podium-2">
                <div class="podium-avatar" id="p2-avatar">?</div>
                <div class="podium-name" id="p2-name">???</div>
                <div class="podium-score" id="p2-score">--<span>L</span></div>
                <div class="podium-number">2</div>
            </div>
            <div class="podium-column first" id="podium-1">
                <i class="fas fa-crown podium-crown"></i>
                <div class="podium-avatar" id="p1-avatar">?</div>
                <div class="podium-name" id="p1-name">???</div>
                <div class="podium-score" id="p1-score">--<span>L</span></div>
                <div class="podium-number">1</div>
            </div>
            <div class="podium-column third" id="podium-3">
                <div class="podium-avatar" id="p3-avatar">?</div>
                <div class="podium-name" id="p3-name">???</div>
                <div class="podium-score" id="p3-score">--<span>L</span></div>
                <div class="podium-number">3</div>
            </div>
        </section>

        <!-- Replaced table with responsive list -->
        <section class="ranking-list" id="ranking-rows-container">
            <!-- Injected by JS -->
        </section>

        <!-- New functionality -->
        <div class="action-buttons">
            <button class="btn-action share" id="btn-share"><i class="fas fa-share-alt"></i> Share</button>
            <button class="btn-action danger" id="btn-reset"><i class="fas fa-undo"></i> Reset Family</button>
        </div>
    </main>
    <nav class="bottom-nav" data-nav="bottom"></nav>
</body>
</html>
