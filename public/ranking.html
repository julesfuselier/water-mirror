<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        /* Apply saved display preferences before first paint (see assets/js/prefs.js) */
        (function () {
            var d = document.documentElement, p = {};
            try { p = JSON.parse(localStorage.getItem('wm_prefs')) || {}; } catch (e) {}
            d.dataset.theme = p.theme || 'light';
            d.dataset.text = p.text || 'm';
            if (p.cvd) d.dataset.cvd = 'on';
            if (p.dys) d.dataset.dys = 'on';
            if (p.motion) d.dataset.motion = 'reduce';
            if (p.contrast) d.dataset.contrast = 'more';
            if (p.dys) document.write('<link rel="stylesheet" id="font-lexend" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400..700&display=swap">');
            var dark = d.dataset.theme === 'dark' || (d.dataset.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.write('<meta name="theme-color" content="' + (dark ? '#000000' : '#f4f7fb') + '">');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Classement · Water Mirror</title>
    <meta name="description" content="Le classement familial Water Mirror.">
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/img/logo-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script type="module" src="/assets/js/pages/ranking.js"></script>
</head>
<body data-page="ranking">
    <header class="topbar" data-nav="top"></header>

    <main class="page">
        <header class="page-header page-header-row">
            <div>
                <h1 class="title-1">Classement</h1>
                <p>Moyenne par douche : la plus basse l’emporte.</p>
            </div>
            <span class="label" style="display: flex; align-items: center; gap: 8px;"><span class="dot" id="status-dot"></span><span id="status-text">Connexion…</span></span>
        </header>

        <section class="podium" id="podium" aria-label="Podium"></section>

        <section class="card section" aria-label="Classement complet">
            <div class="list" id="ranking"></div>
        </section>

        <div style="display: flex; gap: 8px; justify-content: space-between; margin-top: 20px; flex-wrap: wrap;">
            <button class="btn" id="btn-share"><i data-icon="share"></i> Partager</button>
            <button class="btn btn-danger" id="btn-reset">Réinitialiser la famille</button>
        </div>
    </main>

    <nav class="tabbar" data-nav="tabs"></nav>
</body>
</html>
